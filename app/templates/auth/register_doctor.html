{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6">Doctor Registration</h2>
        
        <form method="POST" class="space-y-4">
            {{ form.csrf_token }}
            
            <!-- Basic Information -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">First Name</label>
                    <input type="text" name="first_name" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Last Name</label>
                    <input type="text" name="last_name" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
            </div>
            
            <!-- Professional Information -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Specialization</label>
                <input type="text" name="specialization" required 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">License Number</label>
                <input type="text" name="license_number" required 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Education</label>
                <input type="text" name="education" required 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Years of Experience</label>
                    <input type="number" name="experience_years" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Office Number</label>
                    <input type="text" name="office_number" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Consultation Fee</label>
                <input type="number" step="0.01" name="consultation_fee" required 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </div>
            
            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">
                Register
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline">
                Login here
            </a>
        </p>
    </div>
</div>
{% endblock %}
