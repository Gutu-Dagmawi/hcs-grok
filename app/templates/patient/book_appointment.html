{% extends "base.html" %}

{% block title %}Book Appointment{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6">
            <h1 class="text-2xl font-bold">Book an Appointment</h1>
            <p class="text-blue-100 mt-1">Schedule a consultation with our doctors</p>
        </div>
        
        <!-- Booking Form -->
        <form method="POST" action="{{ url_for('patient.book_appointment') }}" class="p-6 space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Doctor Selection -->
            <div>
                <label for="doctor_id" class="block text-sm font-medium text-gray-700 mb-2">
                    Select Doctor
                </label>
                <select name="doctor_id" id="doctor_id" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Choose a doctor</option>
                    {% for doctor in doctors %}
                        <option value="{{ doctor.id }}" data-specialty="{{ doctor.specialty }}">
                            Dr. {{ doctor.name }} - {{ doctor.specialty }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Date Selection -->
            <div>
                <label for="date" class="block text-sm font-medium text-gray-700 mb-2">
                    Appointment Date
                </label>
                <input type="date" name="date" id="date" required
                       min="{{ today }}"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <!-- Time Selection -->
            <div>
                <label for="time" class="block text-sm font-medium text-gray-700 mb-2">
                    Preferred Time
                </label>
                <select name="time" id="time" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Select time</option>
                    {% for hour in range(9, 17) %}
                        {% for minute in [0, 30] %}
                            <option value="{{ '%02d:%02d'|format(hour, minute) }}">
                                {{ '%02d:%02d'|format(hour, minute) }}
                            </option>
                        {% endfor %}
                    {% endfor %}
                </select>
                <p class="mt-1 text-sm text-gray-500">
                    Available slots are between 9:00 AM and 5:00 PM
                </p>
            </div>
            
            <!-- Reason for Visit -->
            <div>
                <label for="reason" class="block text-sm font-medium text-gray-700 mb-2">
                    Reason for Visit
                </label>
                <textarea name="reason" id="reason" rows="3" required
                          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                          placeholder="Please describe your symptoms or reason for consultation"></textarea>
            </div>
            
            <!-- Submit Button -->
            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('patient.dashboard') }}"
                   class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit"
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Book Appointment
                </button>
            </div>
        </form>
    </div>
    
    <!-- Doctor Information -->
    <div id="doctorInfo" class="mt-6 bg-white rounded-lg shadow-md p-6 hidden">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Doctor Information</h2>
        <div id="doctorDetails" class="space-y-4">
            <!-- Populated by JavaScript -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const doctorSelect = document.getElementById('doctor_id');
    const doctorInfo = document.getElementById('doctorInfo');
    const doctorDetails = document.getElementById('doctorDetails');
    const dateInput = document.getElementById('date');
    
    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;
    
    // Update doctor information when selection changes
    doctorSelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        if (this.value) {
            const specialty = selectedOption.getAttribute('data-specialty');
            doctorDetails.innerHTML = `
                <p class="text-gray-600">
                    <span class="font-medium">Doctor:</span> Dr. ${selectedOption.text.split(' - ')[0]}
                </p>
                <p class="text-gray-600">
                    <span class="font-medium">Specialty:</span> ${specialty}
                </p>
                <p class="text-gray-600">
                    <span class="font-medium">Available Hours:</span> 9:00 AM - 5:00 PM
                </p>
            `;
            doctorInfo.classList.remove('hidden');
        } else {
            doctorInfo.classList.add('hidden');
        }
    });
    
    // Form validation
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        const date = new Date(dateInput.value);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        if (date < today) {
            e.preventDefault();
            alert('Please select a future date for your appointment.');
            return;
        }
        
        if (!doctorSelect.value) {
            e.preventDefault();
            alert('Please select a doctor for your appointment.');
            return;
        }
    });
});
</script>
{% endblock %}
